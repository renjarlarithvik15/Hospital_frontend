cd.<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CarePulse Hospital Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center py-5" style="min-height: 100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand d-inline-flex align-items-center text-primary fs-3">
            <span class="brand-icon"><i class="bi bi-hospital"></i></span>
            <span>CarePulse <span class="text-secondary fw-normal">Hospital</span></span>
          </a>
          <p class="text-muted small mt-2">Sign in to your medical account or portal</p>
        </div>

        <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5 bg-white">
          <h4 class="fw-bold mb-3 text-dark text-center">Welcome Back</h4>

          <!-- Demo Quick-Fill Buttons -->
          <div class="p-3 bg-light rounded-3 mb-4 border">
            <div class="small fw-bold text-muted mb-2 text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.5px;">
              <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Accounts (Click to Fill)
            </div>
            <div class="d-flex flex-wrap gap-2">
              <span class="credential-pill" onclick="fillCredentials('admin', 'admin123')">
                <i class="bi bi-shield-lock me-1"></i> Admin
              </span>
              <span class="credential-pill" onclick="fillCredentials('dr.sarah', 'doctor123')">
                <i class="bi bi-heart-pulse me-1"></i> Doctor
              </span>
              <span class="credential-pill" onclick="fillCredentials('john.doe', 'patient123')">
                <i class="bi bi-person me-1"></i> Patient
              </span>
              <span class="credential-pill" onclick="fillCredentials('staff.mary', 'staff123')">
                <i class="bi bi-people me-1"></i> Staff
              </span>
            </div>
          </div>

          <!-- Alert Placeholder -->
          <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold small text-secondary">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" id="username" placeholder="e.g. admin or john.doe" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="••••••••" required>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 small">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="text-primary text-decoration-none">Forgot password?</a>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
              <span id="btnText"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small text-muted">
            New Patient? <a href="register.html" class="fw-semibold text-primary text-decoration-none">Register here</a>
          </div>

          <div class="text-center mt-2 small">
            <a href="index.html" class="text-secondary text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Homepage</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    function fillCredentials(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('loginAlert');
      alertBox.classList.add('d-none');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      btn.disabled = true;
      btnText.classList.add('d-none');
      btnSpinner.classList.remove('d-none');

      try {
        const response = await API.login(username, password);
        if (response.success && response.data) {
          const role = response.data.role;
          showToast(`Welcome back, ${response.data.fullName || username}!`, 'success');
          
          setTimeout(() => {
            if (role === 'ROLE_ADMIN' || role === 'ROLE_STAFF') {
              window.location.href = 'admin-dashboard.html';
            } else if (role === 'ROLE_DOCTOR') {
              window.location.href = 'doctor-dashboard.html';
            } else {
              window.location.href = 'patient-dashboard.html';
            }
          }, 600);
        } else {
          throw new Error(response.message || 'Login failed');
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Invalid username or password.';
        alertBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
