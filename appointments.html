<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments | CarePulse Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top py-2 px-3">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center text-white" href="appointments.html">
        <span class="brand-icon"><i class="bi bi-hospital"></i></span>
        <span>CarePulse <span class="badge bg-primary fs-6 ms-2">Appointment Desk</span></span>
      </a>

      <div class="d-flex align-items-center ms-auto">
        <a href="admin-dashboard.html" class="btn btn-outline-light btn-sm me-2">
          <i class="bi bi-speedometer2 me-1"></i> Admin Portal
        </a>
        <button onclick="API.logout()" class="btn btn-outline-light btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1">Appointment Scheduling & Management</h3>
        <p class="text-muted small mb-0">Track patient appointments, filter by status or date, and update clinical outcomes</p>
      </div>
      <div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newApptModal">
          <i class="bi bi-calendar-plus me-1"></i> Schedule New Appointment
        </button>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
            <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search by patient or doctor name..." oninput="filterAppointments()">
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="statusFilter" onchange="filterAppointments()">
            <option value="ALL">All Statuses</option>
            <option value="PENDING">Pending Only</option>
            <option value="CONFIRMED">Confirmed Only</option>
            <option value="COMPLETED">Completed Only</option>
            <option value="CANCELLED">Cancelled Only</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="date" id="dateFilter" class="form-control" onchange="filterAppointments()">
        </div>
        <div class="col-md-2 text-end">
          <button onclick="resetFilters()" class="btn btn-outline-secondary w-100">
            <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
          </button>
        </div>
      </div>
    </div>

    <!-- Appointments Table -->
    <div class="table-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Patient</th>
              <th>Doctor</th>
              <th>Date & Time</th>
              <th>Reason</th>
              <th>Symptoms</th>
              <th>Status</th>
              <th>Doctor Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="apptsDeskBody">
            <tr><td colspan="9" class="text-center text-muted py-4">Loading appointments...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal: Schedule New Appointment -->
  <div class="modal fade" id="newApptModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="scheduleApptForm">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Schedule Medical Appointment</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Patient *</label>
                <select class="form-select" id="newPatientSelect" required>
                  <option value="">Select Patient...</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Doctor *</label>
                <select class="form-select" id="newDoctorSelect" required>
                  <option value="">Select Doctor...</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Appointment Date *</label>
                <input type="date" class="form-control" id="newApptDate" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Time Slot *</label>
                <select class="form-select" id="newApptTime" required>
                  <option value="09:00 AM">09:00 AM</option>
                  <option value="10:00 AM" selected>10:00 AM</option>
                  <option value="11:30 AM">11:30 AM</option>
                  <option value="02:00 PM">02:00 PM</option>
                  <option value="03:30 PM">03:30 PM</option>
                  <option value="04:30 PM">04:30 PM</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Reason for Consultation *</label>
              <input type="text" class="form-control" id="newApptReason" required placeholder="e.g. Chest discomfort, Follow up">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Patient Symptoms</label>
              <textarea class="form-control" id="newApptSymptoms" rows="2" placeholder="Clinical notes / symptoms..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary fw-semibold px-4">Book Appointment</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    API.checkAuth(['ROLE_ADMIN', 'ROLE_STAFF']);

    let allAppointments = [];

    async function loadAppointmentsDesk() {
      try {
        allAppointments = await API.getAppointments();
        const patients = await API.getPatients();
        const doctors = await API.getDoctors();

        document.getElementById('newPatientSelect').innerHTML = '<option value="">Select Patient...</option>' +
          patients.map(p => `<option value="${p.id}">${p.fullName || p.username} (ID: #${p.id})</option>`).join('');

        document.getElementById('newDoctorSelect').innerHTML = '<option value="">Select Doctor...</option>' +
          doctors.map(d => `<option value="${d.id}">${d.fullName || d.username} (${d.specialization})</option>`).join('');

        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('newApptDate').value = tomorrow.toISOString().split('T')[0];

        renderAppointmentsTable(allAppointments);
      } catch (err) {
        console.error(err);
      }
    }

    function renderAppointmentsTable(list) {
      const tbody = document.getElementById('apptsDeskBody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">No matching appointments found.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(a => {
        const statusClass = a.status === 'CONFIRMED' ? 'badge-confirmed' :
          a.status === 'COMPLETED' ? 'badge-completed' :
          a.status === 'CANCELLED' ? 'badge-cancelled' : 'badge-pending';

        return `
          <tr>
            <td><span class="badge bg-light text-dark border">#${a.id}</span></td>
            <td>
              <div class="fw-bold">${a.patient?.user?.fullName || 'Patient'}</div>
              <small class="text-muted">${a.patient?.user?.phone || ''}</small>
            </td>
            <td>
              <div class="fw-semibold">${a.doctor?.user?.fullName || 'Doctor'}</div>
              <small class="text-primary">${a.doctor?.specialization || ''}</small>
            </td>
            <td>
              <strong>${formatDate(a.appointmentDate)}</strong><br>
              <small class="text-muted"><i class="bi bi-clock me-1"></i>${a.appointmentTime}</small>
            </td>
            <td class="small text-muted" style="max-width: 180px;">${a.reason || 'Checkup'}</td>
            <td class="small text-muted" style="max-width: 150px;">${a.symptoms || 'None'}</td>
            <td><span class="badge-status ${statusClass}">${a.status}</span></td>
            <td class="small text-muted">${a.doctorNotes || 'None'}</td>
            <td>
              <div class="dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle py-0 px-2" data-bs-toggle="dropdown">Action</button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><a class="dropdown-item" href="#" onclick="updateAppt(${a.id}, 'CONFIRMED')"><i class="bi bi-check2 text-success me-2"></i>Confirm</a></li>
                  <li><a class="dropdown-item" href="#" onclick="updateAppt(${a.id}, 'COMPLETED')"><i class="bi bi-check2-all text-primary me-2"></i>Complete</a></li>
                  <li><a class="dropdown-item" href="#" onclick="updateAppt(${a.id}, 'CANCELLED')"><i class="bi bi-x-circle text-danger me-2"></i>Cancel</a></li>
                </ul>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterAppointments() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const date = document.getElementById('dateFilter').value;

      const filtered = allAppointments.filter(a => {
        const matchesQuery = !q ||
          (a.patient?.user?.fullName || '').toLowerCase().includes(q) ||
          (a.doctor?.user?.fullName || '').toLowerCase().includes(q) ||
          (a.reason || '').toLowerCase().includes(q);

        const matchesStatus = (status === 'ALL') || (a.status === status);
        const matchesDate = !date || (a.appointmentDate === date);

        return matchesQuery && matchesStatus && matchesDate;
      });

      renderAppointmentsTable(filtered);
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('statusFilter').value = 'ALL';
      document.getElementById('dateFilter').value = '';
      renderAppointmentsTable(allAppointments);
    }

    async function updateAppt(id, status) {
      try {
        await API.updateAppointmentStatus(id, status);
        showToast(`Appointment #${id} updated to ${status}`, 'success');
        allAppointments = await API.getAppointments();
        filterAppointments();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    document.getElementById('scheduleApptForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const patId = parseInt(document.getElementById('newPatientSelect').value);
        const docId = parseInt(document.getElementById('newDoctorSelect').value);
        const d = document.getElementById('newApptDate').value;
        const t = document.getElementById('newApptTime').value;
        const r = document.getElementById('newApptReason').value;
        const s = document.getElementById('newApptSymptoms').value;

        await API.bookAppointment({
          patientId: patId,
          doctorId: docId,
          appointmentDate: d,
          appointmentTime: t,
          reason: r,
          symptoms: s,
          status: 'CONFIRMED'
        });

        showToast('Appointment successfully scheduled!', 'success');
        bootstrap.Modal.getInstance(document.getElementById('newApptModal')).hide();
        document.getElementById('scheduleApptForm').reset();
        allAppointments = await API.getAppointments();
        filterAppointments();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    });

    document.addEventListener('DOMContentLoaded', loadAppointmentsDesk);
  </script>
</body>
</html>
