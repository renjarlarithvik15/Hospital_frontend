<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration | CarePulse Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand d-inline-flex align-items-center text-primary fs-3">
            <span class="brand-icon"><i class="bi bi-hospital"></i></span>
            <span>CarePulse <span class="text-secondary fw-normal">Hospital</span></span>
          </a>
          <p class="text-muted small mt-2">Create your patient portal account to book appointments and track prescriptions</p>
        </div>

        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
          <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
            <h4 class="fw-bold mb-0 text-dark">Patient Registration</h4>
            <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill">New Patient</span>
          </div>

          <div id="regAlert" class="alert alert-danger d-none" role="alert"></div>

          <form id="registerForm">
            <!-- Account Info -->
            <h6 class="fw-bold text-primary mb-3"><i class="bi bi-shield-lock me-1"></i> Account Credentials</h6>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Full Name *</label>
                <input type="text" class="form-control" id="fullName" placeholder="e.g. John Doe" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Username *</label>
                <input type="text" class="form-control" id="username" placeholder="e.g. jdoe24" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Email Address *</label>
                <input type="email" class="form-control" id="email" placeholder="e.g. john@example.com" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Password *</label>
                <input type="password" class="form-control" id="password" placeholder="At least 6 characters" minlength="6" required>
              </div>
            </div>

            <!-- Personal & Medical Info -->
            <h6 class="fw-bold text-primary mb-3"><i class="bi bi-person-lines-fill me-1"></i> Patient Details & Medical Background</h6>
            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="+1 (555) 000-0000">
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Date of Birth</label>
                <input type="date" class="form-control" id="dateOfBirth">
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Gender</label>
                <select class="form-select" id="gender">
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Blood Group</label>
                <select class="form-select" id="bloodGroup">
                  <option value="A+">A+</option>
                  <option value="A-">A-</option>
                  <option value="B+">B+</option>
                  <option value="B-">B-</option>
                  <option value="AB+">AB+</option>
                  <option value="AB-">AB-</option>
                  <option value="O+" selected>O+</option>
                  <option value="O-">O-</option>
                </select>
              </div>
              <div class="col-md-8">
                <label class="form-label small fw-semibold">Emergency Contact (Name & Phone)</label>
                <input type="text" class="form-control" id="emergencyContact" placeholder="e.g. Mary Doe (+1 555-123-4567)">
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold">Residential Address</label>
                <input type="text" class="form-control" id="address" placeholder="Street, City, Zip">
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold">Known Medical History / Allergies</label>
                <textarea class="form-control" id="medicalHistory" rows="2" placeholder="e.g. Asthma, Penicillin allergy, Hypertension..."></textarea>
              </div>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" id="regBtn" class="btn btn-primary py-2 fw-semibold rounded-3 shadow-sm">
                <span id="regBtnText"><i class="bi bi-check-circle me-1"></i> Register & Enter Patient Portal</span>
                <span id="regSpinner" class="spinner-border spinner-border-sm d-none"></span>
              </button>
            </div>
          </form>

          <div class="text-center mt-4 pt-3 border-top small text-muted">
            Already registered? <a href="login.html" class="fw-semibold text-primary text-decoration-none">Sign In here</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('regAlert');
      alertBox.classList.add('d-none');

      const payload = {
        fullName: document.getElementById('fullName').value.trim(),
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        phone: document.getElementById('phone').value.trim(),
        dateOfBirth: document.getElementById('dateOfBirth').value || null,
        gender: document.getElementById('gender').value,
        bloodGroup: document.getElementById('bloodGroup').value,
        emergencyContact: document.getElementById('emergencyContact').value.trim(),
        address: document.getElementById('address').value.trim(),
        medicalHistory: document.getElementById('medicalHistory').value.trim()
      };

      const btn = document.getElementById('regBtn');
      const btnText = document.getElementById('regBtnText');
      const btnSpinner = document.getElementById('regSpinner');

      btn.disabled = true;
      btnText.classList.add('d-none');
      btnSpinner.classList.remove('d-none');

      try {
        const response = await API.register(payload);
        if (response.success && response.data) {
          showToast('Account successfully created! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'patient-dashboard.html';
          }, 700);
        } else {
          throw new Error(response.message || 'Registration failed');
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Failed to register account.';
        alertBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
